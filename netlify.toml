[build]
  command = "npm run build"
  publish = "dist"

# ============================================
# Netlify Functions 目录（含 keepalive 心跳函数）
# ============================================
[functions]
  directory = "netlify/functions"

# ============================================
# Supabase API 代理 — 解决国内无法直连 Supabase 的问题
# 浏览器请求 /api/supabase/* → Netlify 转发到 supabase.co
# ============================================
[[redirects]]
  from = "/api/supabase/*"
  to = "https://iseblqpggjwzbgwwrzvd.supabase.co/:splat"
  status = 200
  force = true

# ============================================
# SPA 路由回退 — 所有非文件请求返回 index.html
# ============================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================
# 每日心跳 — 防止 Supabase 免费项目因闲置被自动暂停
# Netlify 每天 09:00 UTC 自动调用一次 keepalive 函数
# ============================================
[functions.keepalive]
  schedule = "0 9 * * *"
